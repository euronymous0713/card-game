<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>インターネット世紀末</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <div class="title-screen" id="titleScreen">
    <h1 class="game-title">インターネット世紀末</h1>

    <p class="subtitle">
      伏せ・ブラフ・読み合いカードゲーム
      <br>
      インターネットが崩壊した世界で、最後のネットゲームをプレイせよ。
    </p>

    <input type="text" id="nameInput" placeholder="名前を入力" maxlength="12">

    <div class="menu-buttons">
      <button id="createRoomButton">ルーム作成</button>
      <button id="joinRoomButton">ルーム参加</button>
    </div>
  </div>

  <div id="lobbyScreen" style="display:none;">
    <h2>待機画面</h2>
    <p id="roomIdText"></p>

    <div id="playerList"></div>

    <div class="lobby-buttons">
      <button id="readyButton">準備完了</button>
      <button id="leaveRoomButton">退出</button>
    </div>

    <button id="startGameButton">ゲーム開始</button>
  </div>

  <div id="battleScreen" style="display:none;">
    <div class="battle-field">

      <div class="enemy-slots">
        <div class="enemy-panel" id="enemySlot1"></div>
        <div class="enemy-panel" id="enemySlot2"></div>
        <div class="enemy-panel" id="enemySlot3"></div>
      </div>

      <div class="turn-panel" id="turnPanel">現在のターン</div>

      <div class="history-panel">
        <h3>使用履歴</h3>
        <div class="played-card-list" id="playedCardList"></div>
      </div>

      <div class="target-panel" id="targetPanel">
        <h3>対象選択</h3>
        <div id="targetList"></div>
      </div>

      <div class="center-zone">
        <div class="battle-message" id="battleMessage">
          インターネット世紀末、開幕。
        </div>

        <div class="drop-zone" id="dropZone">
          ここにカードをドロップ
        </div>
      </div>

      <div class="my-panel" id="myPanel"></div>

      <div class="card-detail" id="cardDetail">
        <h3>カード効果</h3>
        <p>カードにカーソルを合わせると効果が表示されます。</p>
      </div>

      <div class="battle-buttons">
        <button id="endTurnButton">ターン終了</button>
      </div>

      <div class="hand-area" id="handArea"></div>

    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="js/main.js"></script>

</body>

</html>
