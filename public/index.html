<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>インターネット世紀末</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <div class="title-screen" id="titleScreen">
    <h1 class="game-title">インターネット世紀末</h1>

    <p class="subtitle">
      伏せ・ブラフ・読み合いカードゲーム
      <br>
      インターネットが崩壊した世界で、最後のネットゲームをプレイせよ。
    </p>

    <input type="text" id="nameInput" placeholder="名前を入力" maxlength="12">

    <div class="menu-buttons">
      <button id="createRoomButton">ルーム作成</button>
      <button id="joinRoomButton">ルーム参加</button>
    </div>

    <div class="title-sub-buttons">
      <button id="cardListButton" class="card-list-title-button" type="button">カード一覧</button>
    </div>

    <div class="creator-credit">
      Created by Hayato
      <br>
      Ver 0.1.0 Alpha
    </div>
  </div>

  <div class="card-list-overlay" id="cardListOverlay" style="display:none;" aria-hidden="true">
    <div class="card-list-modal">
      <div class="card-list-header">
        <div>
          <h2>カード一覧</h2>
          <p>現在実装されているカードを確認できます。</p>
        </div>
        <button id="cardListCloseButton" class="card-list-close-button" type="button">閉じる</button>
      </div>

      <div class="card-list-control-toggle-row">
        <button id="cardListControlToggleButton" class="card-list-control-toggle-button" type="button" aria-expanded="false">
          検索・絞り込みを開く
        </button>
      </div>

      <div class="card-list-controls" id="cardListControls">
        <div class="card-list-search-box">
          <input type="search" id="cardListSearchInput" placeholder="カード名で検索" autocomplete="off">
        </div>

        <div class="card-list-filter-section">
          <div class="card-list-filter-label">レアリティ</div>
          <div class="card-list-filter-row">
            <button class="card-list-filter-button active-card-list-filter" type="button" data-filter-group="rarity" data-filter="all">すべて</button>
            <button class="card-list-filter-button" type="button" data-filter-group="rarity" data-filter="C">C</button>
            <button class="card-list-filter-button" type="button" data-filter-group="rarity" data-filter="UC">UC</button>
            <button class="card-list-filter-button" type="button" data-filter-group="rarity" data-filter="R">R</button>
            <button class="card-list-filter-button" type="button" data-filter-group="rarity" data-filter="SR">SR</button>
            <button class="card-list-filter-button" type="button" data-filter-group="rarity" data-filter="UR">UR</button>
          </div>
        </div>

        <div class="card-list-filter-section">
          <div class="card-list-filter-label">種類</div>
          <div class="card-list-filter-row">
            <button class="card-list-filter-button active-card-list-filter" type="button" data-filter-group="kind" data-filter="all">すべて</button>
            <button class="card-list-filter-button" type="button" data-filter-group="kind" data-filter="attack">攻撃</button>
            <button class="card-list-filter-button" type="button" data-filter-group="kind" data-filter="support">防御/補助</button>
            <button class="card-list-filter-button" type="button" data-filter-group="kind" data-filter="hate">妨害</button>
            <button class="card-list-filter-button" type="button" data-filter-group="kind" data-filter="trap">罠</button>
            <button class="card-list-filter-button" type="button" data-filter-group="kind" data-filter="special">特殊</button>
          </div>
        </div>
      </div>

      <div class="card-list-body" id="cardListBody">
        <div class="card-list-empty">カード情報を読み込み中です。</div>
      </div>
    </div>
  </div>

  <div id="lobbyScreen" style="display:none;">
    <h2>待機画面</h2>
    <p id="roomIdText"></p>

    <div id="playerList"></div>

    <div class="lobby-buttons">
      <button id="readyButton">準備完了</button>
      <button id="leaveRoomButton">退出</button>
    </div>

    <button id="startGameButton">ゲーム開始</button>
  </div>

  <div id="battleScreen" style="display:none;">
    <div class="battle-field" id="battleField">

      <div id="turnAnnouncement" class="turn-announcement"></div>
      <div id="effectLayer" class="effect-layer"></div>

      <div class="enemy-slots">
        <div class="enemy-panel" id="enemySlot1"></div>
        <div class="enemy-panel" id="enemySlot2"></div>
        <div class="enemy-panel" id="enemySlot3"></div>
      </div>

      <div class="turn-panel" id="turnPanel">現在のターン</div>

      <div class="history-panel">
        <h3>使用履歴</h3>
        <div class="played-card-list" id="playedCardList"></div>
      </div>

      <div class="discard-panel" id="discardZone">
        <h3>捨て札</h3>
        <p>ここに手札をドロップ</p>
      </div>

      <div class="center-zone">
        <div class="battle-message" id="battleMessage">
          インターネット世紀末、開幕。
        </div>

        <div class="drop-zone" id="dropZone">
          ここにカードをドロップ
        </div>

        <div class="field-card-area">
          <h3>自分の伏せカード</h3>
          <div id="myFieldCards"></div>
        </div>
      </div>

      <div class="my-panel" id="myPanel"></div>

      <div class="card-detail" id="cardDetail">
        <h3>カード効果</h3>
        <p>カードにカーソルを合わせると効果が表示されます。</p>
      </div>

      <div class="battle-buttons">
        <button id="endTurnButton">ターン終了</button>
      </div>

      <div class="hand-area" id="handArea"></div>

      <div class="game-over-overlay" id="gameOverOverlay" style="display:none;">
        <div class="game-over-box">
          <h2 id="gameOverText">勝利！</h2>
          <button id="nextButton">次へ</button>
        </div>
      </div>

    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="js/main.js"></script>
  <script src="js/dev.js"></script>
  <script src="js/trapCutin.js"></script>

</body>

</html>
